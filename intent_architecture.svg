<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="cyber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="dashfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12121a"/><stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00d5e8"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1400" height="760" rx="18" fill="#0a0a0f"/>
  <rect width="1400" height="760" rx="18" fill="none" stroke="#1e2735"/>
  <rect x="0" y="0" width="1400" height="4" fill="url(#cyber)" opacity=".85"/>

  <!-- title -->
  <text x="48" y="58" fill="#e8f6f8" font-size="27" font-weight="700" letter-spacing=".5">Intent Analysis Automation</text>
  <text x="48" y="86" fill="#8b8b9a" font-size="15">E-commerce customer-support tickets  →  intents · response types · triggers · templates · decision trees</text>

  <!-- legend -->
  <g font-size="12" fill="#8b8b9a">
    <rect x="1020" y="40" width="12" height="12" rx="3" fill="none" stroke="#00d5e8" stroke-width="1.6"/><text x="1040" y="50.5">Processing</text>
    <rect x="1130" y="40" width="12" height="12" rx="3" fill="none" stroke="#a78bfa" stroke-width="1.6"/><text x="1150" y="50.5">Storage</text>
    <rect x="1226" y="40" width="12" height="12" rx="3" fill="none" stroke="#ff5ecd" stroke-width="1.6"/><text x="1246" y="50.5">Output / UI</text>
  </g>

  <!-- ═══ Col 1 : Source ═══ -->
  <g>
    <rect x="44" y="270" width="240" height="180" rx="16" fill="url(#dashfade)" stroke="#00d5e8" stroke-width="1.4"/>
    <text x="164" y="308" text-anchor="middle" font-size="26">🛒</text>
    <text x="164" y="338" text-anchor="middle" fill="#e8f6f8" font-size="16.5" font-weight="700">E-commerce Helpdesk</text>
    <text x="164" y="362" text-anchor="middle" fill="#9aa3b2" font-size="12.5">Customer-support ticket stream</text>
    <text x="164" y="382" text-anchor="middle" fill="#9aa3b2" font-size="12.5">incoming + outgoing messages</text>
    <text x="164" y="402" text-anchor="middle" fill="#9aa3b2" font-size="12.5">(customer ↔ agent)</text>
  </g>

  <!-- arrow 1 -->
  <line x1="284" y1="360" x2="352" y2="360" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ Col 2 : Ingestion + raw store ═══ -->
  <g>
    <rect x="356" y="228" width="220" height="112" rx="14" fill="url(#dashfade)" stroke="#00d5e8" stroke-width="1.4"/>
    <text x="466" y="264" text-anchor="middle" fill="#e8f6f8" font-size="15.5" font-weight="700">🐍 Ingestion Service</text>
    <text x="466" y="288" text-anchor="middle" fill="#9aa3b2" font-size="12.5">Python · REST + batch sync</text>
    <text x="466" y="308" text-anchor="middle" fill="#9aa3b2" font-size="12.5">dedupe · thread grouping</text>

    <!-- PostgreSQL raw -->
    <g>
      <path d="M376 394 a90 16 0 0 1 180 0 v78 a90 16 0 0 1 -180 0 z" fill="#141422" stroke="#a78bfa" stroke-width="1.4"/>
      <ellipse cx="466" cy="394" rx="90" ry="16" fill="#1c1c30" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="466" y="432" text-anchor="middle" fill="#e8f6f8" font-size="14" font-weight="700">PostgreSQL</text>
      <text x="466" y="452" text-anchor="middle" fill="#9aa3b2" font-size="12">raw messages · tickets</text>
    </g>
    <line x1="466" y1="340" x2="466" y2="374" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrp)"/>
  </g>

  <!-- arrow into temporal -->
  <line x1="576" y1="284" x2="648" y2="284" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M556 430 h56 q14 0 14 -14 v-96" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrp)"/>

  <!-- ═══ Col 3 : Temporal pipeline ═══ -->
  <g>
    <rect x="652" y="150" width="380" height="470" rx="18" fill="#0f0f1a" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="652" y="150" width="380" height="46" rx="18" fill="#171728"/>
    <rect x="652" y="178" width="380" height="18" fill="#171728"/>
    <text x="842" y="180" text-anchor="middle" fill="#c4b5fd" font-size="15.5" font-weight="700">⏱  Temporal — durable workflow</text>

    <rect x="684" y="216" width="316" height="76" rx="12" fill="url(#dashfade)" stroke="#00d5e8" stroke-width="1.3"/>
    <text x="842" y="248" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">1 · Normalize &amp; Clean</text>
    <text x="842" y="272" text-anchor="middle" fill="#9aa3b2" font-size="12">strip noise · PII masking · language detect</text>
    <line x1="842" y1="292" x2="842" y2="312" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="684" y="316" width="316" height="76" rx="12" fill="url(#dashfade)" stroke="#00d5e8" stroke-width="1.3"/>
    <text x="842" y="348" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">2 · Embedder</text>
    <text x="842" y="372" text-anchor="middle" fill="#9aa3b2" font-size="12">semantic vectors for every message</text>
    <line x1="842" y1="392" x2="842" y2="412" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="684" y="416" width="316" height="76" rx="12" fill="url(#dashfade)" stroke="#00d5e8" stroke-width="1.3" filter="url(#glow)"/>
    <text x="842" y="448" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">3 · Gemini 3.1 Pro — LLM calls</text>
    <text x="842" y="472" text-anchor="middle" fill="#9aa3b2" font-size="12">intent + response-type classification</text>
    <line x1="842" y1="492" x2="842" y2="512" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="684" y="516" width="316" height="76" rx="12" fill="url(#dashfade)" stroke="#00d5e8" stroke-width="1.3"/>
    <text x="842" y="548" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">4 · Aggregate &amp; Cluster</text>
    <text x="842" y="572" text-anchor="middle" fill="#9aa3b2" font-size="12">intent taxonomy · pattern mining</text>
  </g>

  <!-- arrow to playbook -->
  <line x1="1032" y1="330" x2="1102" y2="330" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ Col 4 : Playbook ═══ -->
  <g>
    <rect x="1106" y="150" width="250" height="320" rx="16" fill="#0f0f1a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="1231" y="192" text-anchor="middle" fill="#e8f6f8" font-size="16" font-weight="700">📘 Service Playbook</text>
    <text x="1231" y="212" text-anchor="middle" fill="#9aa3b2" font-size="11.5">PostgreSQL · versioned reference</text>

    <rect x="1126" y="232" width="210" height="60" rx="10" fill="#141422" stroke="#00d5e8" stroke-width="1.2"/>
    <text x="1231" y="257" text-anchor="middle" fill="#7fe9f5" font-size="13.5" font-weight="700">⚡ Triggers</text>
    <text x="1231" y="277" text-anchor="middle" fill="#9aa3b2" font-size="11.5">when to act on a message</text>

    <rect x="1126" y="302" width="210" height="60" rx="10" fill="#141422" stroke="#00d5e8" stroke-width="1.2"/>
    <text x="1231" y="327" text-anchor="middle" fill="#7fe9f5" font-size="13.5" font-weight="700">📝 Response Templates</text>
    <text x="1231" y="347" text-anchor="middle" fill="#9aa3b2" font-size="11.5">what to send back</text>

    <rect x="1126" y="372" width="210" height="60" rx="10" fill="#141422" stroke="#00d5e8" stroke-width="1.2"/>
    <text x="1231" y="397" text-anchor="middle" fill="#7fe9f5" font-size="13.5" font-weight="700">🌳 Decision Trees</text>
    <text x="1231" y="417" text-anchor="middle" fill="#9aa3b2" font-size="11.5">which process path per intent</text>
  </g>

  <!-- arrow playbook -> dashboard -->
  <line x1="1231" y1="470" x2="1231" y2="512" stroke="#ff5ecd" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ Col 5 : Dashboard ═══ -->
  <g>
    <rect x="1088" y="516" width="286" height="104" rx="14" fill="url(#dashfade)" stroke="#ff5ecd" stroke-width="1.5"/>
    <text x="1231" y="552" text-anchor="middle" fill="#e8f6f8" font-size="15.5" font-weight="700">⚛ React Analytics Dashboard</text>
    <text x="1231" y="576" text-anchor="middle" fill="#9aa3b2" font-size="12">intent explorer · template library</text>
    <text x="1231" y="595" text-anchor="middle" fill="#9aa3b2" font-size="12">decision-tree viewer · drill-downs</text>
  </g>

  <!-- bottom note -->
  <rect x="44" y="660" width="1312" height="58" rx="12" fill="#101018" stroke="#1e2735"/>
  <text x="700" y="686" text-anchor="middle" fill="#7fe9f5" font-size="13" font-weight="600">Durable execution — automatic retries · fault-tolerance · replayable history (Temporal)</text>
  <text x="700" y="706" text-anchor="middle" fill="#8b8b9a" font-size="12.5">Playbook becomes a reusable reference for any customer-service operation — new teams adopt proven intents, templates &amp; process paths</text>
</svg>
