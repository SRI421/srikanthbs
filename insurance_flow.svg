<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" role="img" aria-label="Insurance document AI data flow">
  <defs>
    <linearGradient id="cy4" x1="0" y1="0" x2="1" y2="0">
