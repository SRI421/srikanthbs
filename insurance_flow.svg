  <line x1="380" y1="232" x2="380" y2="264" stroke="#00d5e8" stroke-width="2" marker-end="url(#arrf4)"/>
  <rect x="60" y="268" width="640" height="66" rx="13" fill="url(#card4)" stroke="#a78bfa" stroke-width="1.4"/>
