<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="cyber3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12121a"/><stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00d5e8"/>
    </marker>
    <marker id="arr3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="18" fill="#0a0a0f"/>
  <rect width="1400" height="760" rx="18" fill="none" stroke="#1e2735"/>
  <rect x="0" y="0" width="1400" height="4" fill="url(#cyber3)" opacity=".85"/>

  <text x="48" y="58" fill="#e8f6f8" font-size="27" font-weight="700" letter-spacing=".5">Knowledge Wiki — Docs-to-Wiki Automation</text>
  <text x="48" y="86" fill="#8b8b9a" font-size="15">Company drive folder  →  self-updating Wikipedia-style knowledge base  +  Ask Wiki RAG assistant</text>

  <!-- legend -->
  <g font-size="12" fill="#8b8b9a">
    <rect x="1020" y="40" width="12" height="12" rx="3" fill="none" stroke="#00d5e8" stroke-width="1.6"/><text x="1040" y="50.5">Processing</text>
    <rect x="1130" y="40" width="12" height="12" rx="3" fill="none" stroke="#a78bfa" stroke-width="1.6"/><text x="1150" y="50.5">Storage</text>
    <rect x="1226" y="40" width="12" height="12" rx="3" fill="none" stroke="#ff5ecd" stroke-width="1.6"/><text x="1246" y="50.5">Output / UI</text>
  </g>

  <!-- Col 1: Drive + OAuth -->
  <g>
    <rect x="44" y="150" width="250" height="190" rx="16" fill="url(#card3)" stroke="#00d5e8" stroke-width="1.4"/>
    <text x="169" y="188" text-anchor="middle" font-size="26">🗂️</text>
    <text x="169" y="218" text-anchor="middle" fill="#e8f6f8" font-size="16" font-weight="700">Company Drive</text>
    <text x="169" y="242" text-anchor="middle" fill="#9aa3b2" font-size="12.5">feature docs · company docs</text>
    <rect x="66" y="262" width="206" height="56" rx="10" fill="#141422" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="169" y="285" text-anchor="middle" fill="#c4b5fd" font-size="12.5" font-weight="700">🔐 Company OAuth login</text>
    <text x="169" y="304" text-anchor="middle" fill="#9aa3b2" font-size="11.5">folder access granted by user</text>
  </g>

  <!-- Col 1b: change tracker below -->
  <g>
    <rect x="44" y="420" width="250" height="180" rx="16" fill="url(#card3)" stroke="#00d5e8" stroke-width="1.4"/>
    <text x="169" y="456" text-anchor="middle" fill="#e8f6f8" font-size="15.5" font-weight="700">👁 Change Tracker</text>
    <text x="169" y="478" text-anchor="middle" fill="#9aa3b2" font-size="12">watches the granted folder</text>
    <g font-size="12.2">
      <text x="86" y="510" fill="#6ee7a0">＋ additions</text>
      <text x="86" y="536" fill="#7fe9f5">↻ updates</text>
      <text x="86" y="562" fill="#ff9e9e">－ deletions</text>
      <text x="186" y="510" fill="#9aa3b2">new page</text>
      <text x="186" y="536" fill="#9aa3b2">re-sync page</text>
      <text x="186" y="562" fill="#9aa3b2">retire page</text>
    </g>
  </g>
  <line x1="169" y1="340" x2="169" y2="416" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="294" y1="510" x2="360" y2="510" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Col 2: Temporal pipeline -->
  <g>
    <rect x="364" y="150" width="330" height="470" rx="18" fill="#0f0f1a" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="364" y="150" width="330" height="46" rx="18" fill="#171728"/>
    <rect x="364" y="178" width="330" height="18" fill="#171728"/>
    <text x="529" y="180" text-anchor="middle" fill="#c4b5fd" font-size="15.5" font-weight="700">⏱  Temporal — doc pipeline</text>

    <rect x="392" y="216" width="274" height="82" rx="12" fill="url(#card3)" stroke="#00d5e8" stroke-width="1.3"/>
    <text x="529" y="250" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">1 · Parse &amp; Extract</text>
    <text x="529" y="274" text-anchor="middle" fill="#9aa3b2" font-size="12">PDF · DOCX · GDoc → clean text + assets</text>
    <line x1="529" y1="298" x2="529" y2="320" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr3)"/>

    <rect x="392" y="324" width="274" height="82" rx="12" fill="url(#card3)" stroke="#00d5e8" stroke-width="1.3"/>
    <text x="529" y="358" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">2 · Chunk &amp; Embed</text>
    <text x="529" y="382" text-anchor="middle" fill="#9aa3b2" font-size="12">semantic chunks → vector embeddings</text>
    <line x1="529" y1="406" x2="529" y2="428" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr3)"/>

    <rect x="392" y="432" width="274" height="82" rx="12" fill="url(#card3)" stroke="#00d5e8" stroke-width="1.3"/>
    <text x="529" y="466" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">3 · Page Generator</text>
    <text x="529" y="490" text-anchor="middle" fill="#9aa3b2" font-size="12">Gemini 3.1 Pro → structured wiki pages</text>
    <line x1="529" y1="514" x2="529" y2="536" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr3)"/>

    <rect x="392" y="540" width="274" height="62" rx="12" fill="url(#card3)" stroke="#00d5e8" stroke-width="1.3"/>
    <text x="529" y="566" text-anchor="middle" fill="#e8f6f8" font-size="14" font-weight="700">4 · Cross-link &amp; Index</text>
    <text x="529" y="587" text-anchor="middle" fill="#9aa3b2" font-size="11.8">related pages · side-menu tree</text>
  </g>

  <!-- Col 3: storage -->
  <g>
    <path d="M764 300 a95 17 0 0 1 190 0 v130 a95 17 0 0 1 -190 0 z" fill="#141422" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="859" cy="300" rx="95" ry="17" fill="#1c1c30" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="859" y="345" text-anchor="middle" fill="#e8f6f8" font-size="15" font-weight="700">PostgreSQL</text>
    <text x="859" y="368" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">+ pgvector</text>
    <text x="859" y="392" text-anchor="middle" fill="#9aa3b2" font-size="11.8">wiki pages · doc chunks</text>
    <text x="859" y="410" text-anchor="middle" fill="#9aa3b2" font-size="11.8">embeddings · page tree</text>
  </g>
  <line x1="694" y1="368" x2="756" y2="368" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr3p)"/>
  <line x1="954" y1="368" x2="1022" y2="368" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Col 4: Wiki UI -->
  <g>
    <rect x="1026" y="150" width="330" height="290" rx="16" fill="url(#card3)" stroke="#ff5ecd" stroke-width="1.5"/>
    <text x="1191" y="186" text-anchor="middle" fill="#e8f6f8" font-size="16" font-weight="700">⚛ Wiki UI — React</text>
    <text x="1191" y="207" text-anchor="middle" fill="#9aa3b2" font-size="12">reads exactly like Wikipedia</text>
    <!-- mini wireframe -->
    <rect x="1050" y="222" width="282" height="196" rx="10" fill="#0d0d15" stroke="#243040"/>
    <rect x="1050" y="222" width="282" height="30" rx="10" fill="#171728"/>
    <rect x="1050" y="240" width="282" height="12" fill="#171728"/>
    <rect x="1062" y="231" width="120" height="11" rx="5" fill="#3a4a5f"/>
    <rect x="1062" y="264" width="74" height="142" rx="7" fill="#12121c" stroke="#243040"/>
    <rect x="1070" y="276" width="58" height="8" rx="4" fill="#00d5e8" opacity=".85"/>
    <rect x="1070" y="292" width="48" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1070" y="306" width="52" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1070" y="320" width="44" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1070" y="334" width="50" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1070" y="348" width="46" height="7" rx="3.5" fill="#3a4a5f"/>
    <text x="1099" y="398" text-anchor="middle" fill="#5b6b80" font-size="9.5">side menus</text>
    <rect x="1148" y="264" width="172" height="14" rx="6" fill="#e8f6f8" opacity=".8"/>
    <rect x="1148" y="288" width="160" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1148" y="301" width="168" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1148" y="314" width="150" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1148" y="334" width="80" height="9" rx="4" fill="#00d5e8" opacity=".7"/>
    <rect x="1148" y="350" width="164" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1148" y="363" width="158" height="7" rx="3.5" fill="#3a4a5f"/>
    <rect x="1148" y="376" width="120" height="7" rx="3.5" fill="#3a4a5f"/>
    <text x="1234" y="402" text-anchor="middle" fill="#5b6b80" font-size="9.5">sections · infoboxes · cross-links</text>
  </g>

  <!-- Col 4b: Ask Wiki -->
  <g>
    <rect x="1026" y="470" width="330" height="150" rx="16" fill="url(#card3)" stroke="#ff5ecd" stroke-width="1.5"/>
    <text x="1191" y="506" text-anchor="middle" fill="#e8f6f8" font-size="15.5" font-weight="700">💬 Ask Wiki — RAG assistant</text>
    <text x="1191" y="530" text-anchor="middle" fill="#9aa3b2" font-size="12">real-time answers for support teams</text>
    <text x="1191" y="552" text-anchor="middle" fill="#9aa3b2" font-size="12">grounded in wiki docs · with citations</text>
    <text x="1191" y="580" text-anchor="middle" fill="#7fe9f5" font-size="11.8">pgvector retrieval + Gemini 3.1 Pro</text>
  </g>
  <path d="M916 452 C 950 520, 970 538, 1018 544" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arr3p)"/>
  <text x="964" y="500" fill="#5b6b80" font-size="11">retrieval</text>

  <!-- bottom note -->
  <rect x="44" y="660" width="1312" height="58" rx="12" fill="#101018" stroke="#1e2735"/>
  <text x="700" y="686" text-anchor="middle" fill="#7fe9f5" font-size="13" font-weight="600">Zero-touch sync — the wiki mirrors the drive folder: add a doc, get a page · edit a doc, page re-syncs · delete a doc, page retires</text>
  <text x="700" y="706" text-anchor="middle" fill="#8b8b9a" font-size="12.5">Multi-tenant: every subscribed company gets its own OAuth-scoped wiki + Ask Wiki over its own documents</text>
</svg>
