<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="cyber2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12121a"/><stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00d5e8"/>
    </marker>
    <marker id="arr2m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff5ecd"/>
    </marker>
  </defs>

  <rect width="1400" height="620" rx="18" fill="#0a0a0f"/>
  <rect width="1400" height="620" rx="18" fill="none" stroke="#1e2735"/>
  <rect x="0" y="0" width="1400" height="4" fill="url(#cyber2)" opacity=".85"/>

  <text x="48" y="56" fill="#e8f6f8" font-size="25" font-weight="700">How a message becomes an action</text>
  <text x="48" y="82" fill="#8b8b9a" font-size="14.5">Intent × response-type → decision-tree path → trigger + template</text>

  <!-- Step 1: message -->
  <g>
    <rect x="44" y="150" width="250" height="120" rx="14" fill="url(#card2)" stroke="#00d5e8" stroke-width="1.4"/>
    <text x="169" y="184" text-anchor="middle" font-size="22">💬</text>
    <text x="169" y="212" text-anchor="middle" fill="#e8f6f8" font-size="15" font-weight="700">New ticket message</text>
    <text x="169" y="236" text-anchor="middle" fill="#9aa3b2" font-size="12" font-style="italic">"Where is my refund for</text>
    <text x="169" y="253" text-anchor="middle" fill="#9aa3b2" font-size="12" font-style="italic">order #4821?"</text>
  </g>
  <line x1="294" y1="210" x2="356" y2="210" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Step 2: classify -->
  <g>
    <rect x="348" y="130" width="284" height="160" rx="14" fill="url(#card2)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="490" y="164" text-anchor="middle" fill="#c4b5fd" font-size="13.8" font-weight="700">🧠 Embeddings + Gemini 3.1 Pro</text>
    <rect x="384" y="182" width="212" height="40" rx="9" fill="#141422" stroke="#00d5e8" stroke-width="1.1"/>
    <text x="490" y="207" text-anchor="middle" fill="#7fe9f5" font-size="13">Intent: <tspan font-weight="700">Refund status</tspan></text>
    <rect x="384" y="232" width="212" height="40" rx="9" fill="#141422" stroke="#00d5e8" stroke-width="1.1"/>
    <text x="490" y="257" text-anchor="middle" fill="#7fe9f5" font-size="13">Response type: <tspan font-weight="700">Informational</tspan></text>
  </g>
  <line x1="632" y1="210" x2="682" y2="210" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Step 3: decision tree -->
  <g>
    <rect x="686" y="110" width="330" height="330" rx="14" fill="#0f0f1a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="851" y="146" text-anchor="middle" fill="#e8f6f8" font-size="15" font-weight="700">🌳 Decision tree — refund status</text>

    <!-- root -->
    <rect x="786" y="166" width="130" height="44" rx="9" fill="#141422" stroke="#00d5e8" stroke-width="1.2"/>
    <text x="851" y="193" text-anchor="middle" fill="#e8f6f8" font-size="12.5">Refund initiated?</text>

    <!-- branches -->
    <path d="M816 210 q-60 24 -66 56" fill="none" stroke="#00d5e8" stroke-width="1.6" marker-end="url(#arr2)"/>
    <path d="M886 210 q60 24 66 56" fill="none" stroke="#00d5e8" stroke-width="1.6" marker-end="url(#arr2)"/>
    <text x="740" y="242" fill="#7fe9f5" font-size="11.5">yes</text>
    <text x="952" y="242" fill="#ff9edb" font-size="11.5">no</text>

    <rect x="706" y="270" width="130" height="52" rx="9" fill="#141422" stroke="#00d5e8" stroke-width="1.2"/>
    <text x="771" y="291" text-anchor="middle" fill="#e8f6f8" font-size="11.8">ETA within SLA?</text>
    <text x="771" y="309" text-anchor="middle" fill="#9aa3b2" font-size="9.8">check payment gateway</text>

    <rect x="866" y="270" width="130" height="52" rx="9" fill="#141422" stroke="#ff5ecd" stroke-width="1.2"/>
    <text x="931" y="291" text-anchor="middle" fill="#e8f6f8" font-size="11.8">Escalate → agent</text>
    <text x="931" y="309" text-anchor="middle" fill="#9aa3b2" font-size="10.8">trigger: priority queue</text>

    <path d="M771 322 v28" fill="none" stroke="#00d5e8" stroke-width="1.6" marker-end="url(#arr2)"/>
    <rect x="706" y="354" width="130" height="52" rx="9" fill="#141422" stroke="#00d5e8" stroke-width="1.2"/>
    <text x="771" y="375" text-anchor="middle" fill="#e8f6f8" font-size="11.8">Auto-reply</text>
    <text x="771" y="393" text-anchor="middle" fill="#9aa3b2" font-size="10.8">template: refund-eta</text>
  </g>
  <line x1="1016" y1="270" x2="1078" y2="270" stroke="#ff5ecd" stroke-width="2" marker-end="url(#arr2m)"/>

  <!-- Step 4: action -->
  <g>
    <rect x="1082" y="150" width="274" height="240" rx="14" fill="url(#card2)" stroke="#ff5ecd" stroke-width="1.5"/>
    <text x="1219" y="186" text-anchor="middle" fill="#e8f6f8" font-size="15" font-weight="700">⚡ Action executed</text>
    <rect x="1104" y="206" width="230" height="52" rx="9" fill="#141422" stroke="#00d5e8" stroke-width="1.1"/>
    <text x="1219" y="228" text-anchor="middle" fill="#7fe9f5" font-size="12.5" font-weight="600">Trigger fired</text>
    <text x="1219" y="247" text-anchor="middle" fill="#9aa3b2" font-size="11.3">gateway lookup · status fetched</text>
    <rect x="1104" y="268" width="230" height="52" rx="9" fill="#141422" stroke="#00d5e8" stroke-width="1.1"/>
    <text x="1219" y="290" text-anchor="middle" fill="#7fe9f5" font-size="12.5" font-weight="600">Template response sent</text>
    <text x="1219" y="309" text-anchor="middle" fill="#9aa3b2" font-size="11.3">"Your refund lands in 2–3 days"</text>
    <rect x="1104" y="330" width="230" height="44" rx="9" fill="#141422" stroke="#a78bfa" stroke-width="1.1"/>
    <text x="1219" y="357" text-anchor="middle" fill="#c4b5fd" font-size="11.8">logged → improves the playbook</text>
  </g>

  <!-- bottom note -->
  <rect x="44" y="490" width="1312" height="86" rx="12" fill="#101018" stroke="#1e2735"/>
  <text x="700" y="524" text-anchor="middle" fill="#7fe9f5" font-size="13.5" font-weight="600">Every intent × response-type pair maps to a curated process path</text>
  <text x="700" y="548" text-anchor="middle" fill="#8b8b9a" font-size="12.5">Analysts refine triggers, templates and trees in the React dashboard — the playbook keeps learning from real conversations</text>
</svg>
