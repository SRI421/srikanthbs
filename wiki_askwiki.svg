<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="cyber4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12121a"/><stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00d5e8"/>
    </marker>
    <marker id="arr4m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff5ecd"/>
    </marker>
  </defs>

  <rect width="1400" height="480" rx="18" fill="#0a0a0f"/>
  <rect width="1400" height="480" rx="18" fill="none" stroke="#1e2735"/>
  <rect x="0" y="0" width="1400" height="4" fill="url(#cyber4)" opacity=".85"/>

  <text x="48" y="56" fill="#e8f6f8" font-size="25" font-weight="700">Ask Wiki — retrieval-augmented answers</text>
  <text x="48" y="82" fill="#8b8b9a" font-size="14.5">On-time answers for customer-support staff, grounded in the company's own wiki</text>

  <!-- 1 question -->
  <g>
    <rect x="44" y="150" width="240" height="130" rx="14" fill="url(#card4)" stroke="#00d5e8" stroke-width="1.4"/>
    <text x="164" y="184" text-anchor="middle" font-size="22">🙋</text>
    <text x="164" y="212" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">Support staff asks</text>
    <text x="164" y="236" text-anchor="middle" fill="#9aa3b2" font-size="11.8" font-style="italic">"How does bulk-order</text>
    <text x="164" y="253" text-anchor="middle" fill="#9aa3b2" font-size="11.8" font-style="italic">pricing work?"</text>
  </g>
  <line x1="284" y1="215" x2="342" y2="215" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- 2 embed -->
  <g>
    <rect x="346" y="160" width="210" height="110" rx="14" fill="url(#card4)" stroke="#00d5e8" stroke-width="1.4"/>
    <text x="451" y="199" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">🧬 Embed query</text>
    <text x="451" y="223" text-anchor="middle" fill="#9aa3b2" font-size="12">question → vector</text>
    <text x="451" y="243" text-anchor="middle" fill="#9aa3b2" font-size="12">same embedder as docs</text>
  </g>
  <line x1="556" y1="215" x2="614" y2="215" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- 3 retrieve -->
  <g>
    <rect x="618" y="140" width="250" height="150" rx="14" fill="url(#card4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="743" y="176" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">🗄 pgvector search</text>
    <text x="743" y="200" text-anchor="middle" fill="#9aa3b2" font-size="12">cosine similarity over</text>
    <text x="743" y="219" text-anchor="middle" fill="#9aa3b2" font-size="12">wiki-doc chunks</text>
    <rect x="640" y="234" width="206" height="38" rx="9" fill="#141422" stroke="#7c3aed" stroke-width="1.1"/>
    <text x="743" y="258" text-anchor="middle" fill="#c4b5fd" font-size="12">top-k relevant chunks + sources</text>
  </g>
  <line x1="868" y1="215" x2="926" y2="215" stroke="#00d5e8" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- 4 LLM -->
  <g>
    <rect x="930" y="160" width="210" height="110" rx="14" fill="url(#card4)" stroke="#00d5e8" stroke-width="1.4"/>
    <text x="1035" y="199" text-anchor="middle" fill="#e8f6f8" font-size="14.5" font-weight="700">✨ Gemini 3.1 Pro</text>
    <text x="1035" y="223" text-anchor="middle" fill="#9aa3b2" font-size="12">answer from retrieved</text>
    <text x="1035" y="243" text-anchor="middle" fill="#9aa3b2" font-size="12">context only</text>
  </g>
  <line x1="1140" y1="215" x2="1198" y2="215" stroke="#ff5ecd" stroke-width="2" marker-end="url(#arr4m)"/>

  <!-- 5 answer -->
  <g>
    <rect x="1202" y="140" width="154" height="150" rx="14" fill="url(#card4)" stroke="#ff5ecd" stroke-width="1.5"/>
    <text x="1279" y="178" text-anchor="middle" font-size="22">✅</text>
    <text x="1279" y="206" text-anchor="middle" fill="#e8f6f8" font-size="14" font-weight="700">Grounded answer</text>
    <text x="1279" y="228" text-anchor="middle" fill="#9aa3b2" font-size="11.5">with citations to</text>
    <text x="1279" y="246" text-anchor="middle" fill="#9aa3b2" font-size="11.5">wiki pages</text>
  </g>

  <!-- wiki store feeding -->
  <g>
    <path d="M648 356 a95 14 0 0 1 190 0 v40 a95 14 0 0 1 -190 0 z" fill="#141422" stroke="#a78bfa" stroke-width="1.4"/>
    <ellipse cx="743" cy="356" rx="95" ry="14" fill="#1c1c30" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="743" y="388" text-anchor="middle" fill="#c4b5fd" font-size="11.5">wiki pages · embeddings</text>
  </g>
  <line x1="743" y1="340" x2="743" y2="296" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arr4)"/>
  <text x="762" y="322" fill="#5b6b80" font-size="11">kept fresh by drive sync</text>

  <!-- bottom -->
  <text x="700" y="446" text-anchor="middle" fill="#8b8b9a" font-size="12.5">No hallucinated policies — if it's not in the company's docs, Ask Wiki says so and links the nearest page</text>
</svg>
