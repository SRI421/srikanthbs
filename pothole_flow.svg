  <line x1="380" y1="130" x2="380" y2="162" stroke="#00d5e8" stroke-width="2" marker-end="url(#arrf5)"/>
  <rect x="60" y="166" width="640" height="66" rx="13" fill="url(#card5)" stroke="#a78bfa" stroke-width="1.4"/>
