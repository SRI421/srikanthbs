<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" role="img" aria-label="Pothole detection data flow">
  <defs>
    <linearGradient id="cy5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13131d"/><stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrf5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00d5e8"/>
